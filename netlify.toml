# Netlify settings for FlowHealth (read automatically when this file is in the repo root)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be cached by the browser, or app updates get stuck.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Tell browsers the manifest is a web app manifest (needed for "Install app" on Android).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
